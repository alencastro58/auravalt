; Limites de envio do AuraVault (100 MB por arquivo). Lido pelo PHP em CGI/FastCGI/PHP-FPM.
; Se a hospedagem ignorar estes valores, ajuste no cPanel (MultiPHP INI Editor).
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
session.use_strict_mode = 1
