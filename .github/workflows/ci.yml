name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, pdo_sqlite, mbstring
          coverage: none
      - name: Sintaxe
        run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
      - name: Teste de fumaça
        run: php tests/smoke.php
      - name: Teste de integração HTTP
        run: php tests/http.php
